# 结构分组定义（M1-2，issue #2）——select.py 的输入，人可编辑。
#
# 每组把若干 BP3D 概念（英文名精确匹配，或 patterns 正则匹配）合并为一个可点击结构。
# set: isa（细分部件，默认）| partof（复合器官，补齐 isa 缺的整器官）。
# 元素文件按 FJ id 去重，因此聚合概念与其子部件概念重复匹配不会导致网格重复。
# 概念名均已对照 4.0 版 *_parts_list_e.txt 核实；匹配不到的组会在 select.py 报告中列出。
#
# 挑选规则（KICKOFF 第 7 节）：科普可辨认优先。骨骼：颅骨整体、椎骨按颈/胸/腰分组、
# 肋骨整体、腕骨/跗骨各一组、四肢长骨单列。已知缺口（BP3D 4.0 两集皆无）：尾骨、
# 甲状腺、子宫/卵巢（男性模型）、坐骨神经等周围神经、背阔肌/咬肌等部分浅层肌。

defaults:
  # 各系统目标面数基准（2026-08-18 观感升级：整体提高一档）
  target_faces:
    skin: 60000
    muscles: 4000
    skeleton: 5000
    organs: 10000
    vessels: 6000
    nerves: 6000
  # 源网格远比基准细时按"最大压缩比"放宽：BP3D 有些部件几十万面，硬压到基准会丢光表面细节。
  # 实际目标 = max(基准, 源面数 / max_compression)。
  max_compression: 2
  # 再统一封顶，免得个别超密结构（肋间肌 37.7 万面）吃掉整个面数预算。
  # 显式写了更大 target_faces 的组（如皮肤 60000）不受此限——显式配置永远是下限。
  max_target_faces: 30000

groups:
  # ================= 皮肤 =================
  - slug: skin
    zh: 皮肤
    en: Skin
    system: skin
    region: whole
    side: none
    priority: 1
    target_faces: 60000
    concepts: [skin]

