name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; echo "package.json 尚不存在，跳过（M0 完成后自动生效）"; fi
      - if: steps.check.outputs.has == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.check.outputs.has == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.check.outputs.has == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.has == 'true'
        run: pnpm lint
      - if: steps.check.outputs.has == 'true'
        run: pnpm test
      - if: steps.check.outputs.has == 'true'
        run: pnpm build
      # 数据流水线：单元测试 + 已提交产物校验（M1-5，仅需轻量纯 Python 依赖）
      - if: steps.check.outputs.has == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: steps.check.outputs.has == 'true'
        run: pip install -q pyyaml numpy pytest pygltflib
      - if: steps.check.outputs.has == 'true'
        run: pnpm pipeline:test
      - if: steps.check.outputs.has == 'true'
        run: python3 pipeline/validate.py --require-manifest
