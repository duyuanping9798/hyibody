name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.check.outputs.has }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f package.json ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; echo "package.json 尚不存在，跳过部署（M0 完成后自动生效）"; fi
      - if: steps.check.outputs.has == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.check.outputs.has == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.check.outputs.has == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.has == 'true'
        run: pnpm build
        env:
          VITE_BASE: /hyibody/
      - if: steps.check.outputs.has == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.has == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
